<!doctype html><html lang="ku" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorldStore Admin</title>
<style>body{font-family:Arial;margin:0;background:#f3f4f6}.wrap{max-width:1000px;margin:auto;padding:25px}.box{background:white;padding:20px;border-radius:15px;margin-bottom:20px}input,button{padding:11px;margin:5px;border-radius:9px;border:1px solid #ddd}button{background:#2563eb;color:white;border:0;cursor:pointer}.item{border-bottom:1px solid #ddd;padding:12px}.hide{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}</style></head>
<body><div class="wrap">
<div id="login" class="box"><h1>🔐 WorldStore Admin</h1><input id="user" placeholder="ناوی بەکارهێنەر"><input id="pass" type="password" placeholder="وشەی نهێنی"><button onclick="login()">چوونەژوورەوە</button><p id="err"></p></div>
<div id="app" class="hide"><div class="box"><h1>داشبۆردی Admin</h1><button onclick="logout()">دەرچوون</button></div>
<div class="box"><h2>➕ زیادکردنی کاڵا</h2><div class="grid"><input id="name" placeholder="ناوی کاڵا"><input id="price" type="number" placeholder="نرخ"><input id="category" placeholder="جۆر"><input id="image" placeholder="لینکی وێنە"></div><button onclick="addProduct()">زیادکردن</button></div>
<div class="box"><h2>📦 کاڵاکان</h2><div id="list"></div></div>
<div class="box"><h2>🧾 داواکارییەکان</h2><div id="orders">بارکردن...</div></div></div></div>
<script>
function login(){if(user.value==="Rayan_Barware"&&pass.value==="Duhok..123&$"){sessionStorage.wsadmin="1";show()}else err.textContent="زانیارییەکان هەڵەن"}
function show(){loginBox=document.getElementById("login");loginBox.classList.add("hide");document.getElementById("app").classList.remove("hide");load()}
function logout(){sessionStorage.removeItem("wsadmin");location.reload()}
async function load(){let r=await fetch("/api/products");let p=await r.json();list.innerHTML=p.map(x=>`<div class="item"><b>${x.name}</b> — $${x.price} — ${x.category||x.cat||""} <button onclick="del(${x.id})">سڕینەوە</button></div>`).join("");let o=await fetch("/api/orders");let a=await o.json();orders.innerHTML=a.length?a.map(x=>`<div class="item"><b>${x.customer.first} ${x.customer.last}</b> — ${x.customer.phone} — $${x.total}<br>${x.customer.address||""}</div>`).join(""):"هیچ داواکارییەک نییە"}
async function addProduct(){await fetch("/api/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name.value,price:Number(price.value),category:category.value,img:image.value})});name.value=price.value=category.value=image.value="";load()}
async function del(id){await fetch("/api/products/"+id,{method:"DELETE"});load()}
if(sessionStorage.wsadmin==="1")show()
</script></body></html>
