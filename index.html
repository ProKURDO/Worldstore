<!doctype html>
<html lang="ku" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorldStore</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#18212f}header{background:#111827;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}header h1{margin:0}.wrap{max-width:1100px;margin:auto;padding:25px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}input,select,button,textarea{padding:12px;border:1px solid #d1d5db;border-radius:10px;font:inherit}input,select,textarea{background:#fff}button{background:#2563eb;color:white;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 18px #00000010}.card img{width:100%;height:180px;object-fit:cover;border-radius:12px;background:#eee}.price{font-weight:bold;font-size:20px;margin:10px 0}.cart{position:fixed;bottom:20px;left:20px;background:#111827;padding:15px 20px;border-radius:14px;color:#fff}.panel{background:#fff;padding:20px;border-radius:16px;margin-top:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.row{grid-template-columns:1fr}}
</style></head>
<body>
<header><h1>🌍 WorldStore</h1><a href="admin.html" style="color:white">🔐 Admin</a></header>
<div class="wrap">
<div class="toolbar"><input id="search" placeholder="گەڕان بۆ کاڵا..." oninput="render()"><select id="cat" onchange="render()"><option value="">هەموو جۆرەکان</option></select></div>
<div id="products" class="grid"></div>
<div class="panel"><h2>🛒 سەبەتە</h2><div id="cart"></div>
<h3 id="total"></h3>
<div class="row"><input id="first" placeholder="ناوی یەکەم"><input id="last" placeholder="ناوی دووەم"><input id="phone" placeholder="ژمارەی مۆبایل"><input id="email" placeholder="ئیمەیڵ"><input id="city" placeholder="شار"><input id="state" placeholder="پارێزگا"><textarea id="address" placeholder="ناونیشان"></textarea></div>
<br><button onclick="checkout()">ناردنی داواکاری</button><p id="msg"></p></div></div>
<script>
const seed=[{id:1,name:"T-Shirt",price:15,cat:"جل‌وبەرگ",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600"},{id:2,name:"Shoes",price:35,cat:"پێڵاو",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600"},{id:3,name:"Bag",price:25,cat:"جانتا",img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=600"}];
let products=JSON.parse(localStorage.getItem("ws_products")||"null")||seed, cart=JSON.parse(localStorage.getItem("ws_cart")||"[]");
function save(){localStorage.setItem("ws_products",JSON.stringify(products));localStorage.setItem("ws_cart",JSON.stringify(cart))}
function render(){let q=search.value.toLowerCase(),c=cat.value;let cats=[...new Set(products.map(x=>x.cat))];cat.innerHTML='<option value="">هەموو جۆرەکان</option>'+cats.map(x=>`<option ${x==c?"selected":""}>${x}</option>`).join("");productsEl.innerHTML=products.filter(x=>(!c||x.cat==c)&&x.name.toLowerCase().includes(q)).map(x=>`<div class="card"><img src="${x.img||''}"><h3>${x.name}</h3><div>${x.cat}</div><div class="price">$${x.price}</div><button onclick="add(${x.id})">زیادکردن بۆ سەبەتە</button></div>`).join("");renderCart()}
const productsEl=document.getElementById("products");
function add(id){let p=products.find(x=>x.id==id);cart.push(p);save();renderCart()}
function renderCart(){cartEl.innerHTML=cart.length?cart.map((x,i)=>`${x.name} — $${x.price} <button onclick="removeItem(${i})">×</button>`).join("<hr>"):"سەبەتە بەتاڵە";total.textContent="کۆی گشتی: $"+cart.reduce((s,x)=>s+Number(x.price),0)}
function removeItem(i){cart.splice(i,1);save();renderCart()}
async function checkout(){if(!cart.length)return msg.textContent="سەبەتە بەتاڵە";let order={customer:{first:first.value,last:last.value,phone:phone.value,email:email.value,city:city.value,state:state.value,address:address.value},items:cart,total:cart.reduce((s,x)=>s+Number(x.price),0)};try{let r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(order)});let j=await r.json();if(!r.ok)throw Error(j.error);msg.textContent="داواکارییەکەت بە سەرکەوتوویی نێردرا.";cart=[];save();renderCart()}catch(e){msg.textContent="پەیوەندی بە سێرڤەر نەکرا. تکایە سێرڤەرەکە دەستپێبکە."}}
render();
</script></body></html>
